# Evita que el proyecto gratuito de Supabase se pause por inactividad
# (se pausa tras ~7 días sin uso). Hace una consulta mínima cada 3 días.
# Requiere dos "secrets" en GitHub: SUPABASE_URL y SUPABASE_ANON_KEY.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a la API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/sections?select=id&limit=1"
